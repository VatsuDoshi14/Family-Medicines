<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#162029" media="(prefers-color-scheme: dark)">
<meta name="description" content="Track your family’s medicines, stock and refills.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medicines">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Medicine Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F8FAFB;--ink:#14212B;--muted:#55636F;--faint:#8996A2;--line:#DFE5EA;
  --accent:#2450B8;--accent-ink:#FFFFFF;--accent-soft:#E7EDFA;
  --ok:#1D7A52;--ok-soft:#E2F2EA;--warn:#9C6410;--warn-soft:#FAEFD9;--bad:#B8322A;--bad-soft:#FBE4E1;--idle:#7D8A96;--idle-soft:#ECEFF2;
  --r-l:18px;--r-m:12px;--r-s:9px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E151B;--surface:#162029;--surface-2:#1B2631;--ink:#E6EDF2;--muted:#A2B0BB;--faint:#7A8894;--line:#283541;
  --accent:#86A8FF;--accent-ink:#0E151B;--accent-soft:#1E2B48;
  --ok:#62C997;--ok-soft:#163126;--warn:#E5B25C;--warn-soft:#372B15;--bad:#FF8C80;--bad-soft:#3C1F1C;--idle:#93A0AB;--idle-soft:#222D37;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0E151B;--surface:#162029;--surface-2:#1B2631;--ink:#E6EDF2;--muted:#A2B0BB;--faint:#7A8894;--line:#283541;
    --accent:#86A8FF;--accent-ink:#0E151B;--accent-soft:#1E2B48;
    --ok:#62C997;--ok-soft:#163126;--warn:#E5B25C;--warn-soft:#372B15;--bad:#FF8C80;--bad-soft:#3C1F1C;--idle:#93A0AB;--idle-soft:#222D37;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700}
h1{font-size:clamp(28px,4.2vw,40px);letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17.5px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14.5px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:20px;height:20px;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:24px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;padding:0 8px;color:var(--ink);text-decoration:none}
.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);position:relative;flex:none;display:inline-block}
.logo::after{content:"";position:absolute;left:5px;right:5px;top:11px;height:8px;border-radius:99px;background:var(--surface);transform:rotate(-38deg)}
.logo.lg{width:48px;height:48px;border-radius:15px}
.logo.lg::after{left:9px;right:9px;top:18px;height:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side .grow{flex:1}
.side-note{font-size:13.5px;color:var(--muted);padding:0 8px}
main{padding:34px clamp(16px,4vw,52px) 110px;min-width:0;max-width:1220px;width:100%}
.topbar,.tabbar{display:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .btn-row{flex-wrap:nowrap}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
  .tabbar svg{width:23px;height:23px}
  .tabbar .badge{position:absolute;top:-2px;left:calc(50% + 5px);min-width:18px;height:18px;font-size:11px;padding:0 5px;margin:0}
  main{padding:22px 16px calc(110px + env(safe-area-inset-bottom,0px))}
}

/* Page structure */
.page-head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.page-head .sub{margin-top:6px;color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;font-weight:700;text-decoration:none}
.stack>*+*{margin-top:24px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 22px}
.panel-head,.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head{margin-bottom:14px}
.link{font-weight:700;text-decoration:none;font-size:15.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters select,.filters input{width:auto;min-width:150px;flex:1 1 150px}
@media (max-width:600px){.filters{width:100%}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.toolbar input[type=search]{flex:1 1 240px;width:auto}
.toolbar select,.toolbar input[type=date]{flex:1 1 170px;width:auto;min-width:0}
.toolbar>*{min-width:0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;padding:0}
.kpi{background:var(--surface);border:0;padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.kpi:hover{background:var(--surface-2)}
.kpi b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14.5px}
.kpi.is-bad b{color:var(--bad)}
.kpi.is-warn b{color:var(--warn)}

/* Banner */
.banner{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-radius:var(--r-l);background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 28%,transparent)}
.banner .b-icon{color:var(--bad);padding-top:2px}
.banner h2{font-size:18px;margin-bottom:6px}
.banner ul{list-style:none;margin:0;padding:0}
.banner li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--bad) 18%,transparent)}
.banner li:first-child{border-top:0}
.banner .b-body{flex:1;min-width:0}

/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(130px,1fr) minmax(120px,.8fr) auto;gap:14px;align-items:center;padding:14px 8px;border-top:1px solid var(--line);color:inherit;text-decoration:none;border-radius:10px}
.row:first-child{border-top:0}
a.row:hover{background:var(--surface-2)}
.r-main{display:flex;align-items:center;gap:12px;min-width:0}
.name{font-weight:700;color:var(--ink);text-decoration:none}
.sub{color:var(--muted);font-size:14.5px}
.r-stock{display:flex;flex-direction:column;gap:5px}
.r-end{justify-self:end}
.compact .row{grid-template-columns:minmax(0,1.4fr) minmax(110px,1fr) auto}
@media (max-width:700px){
  .row,.compact .row{grid-template-columns:1fr auto;row-gap:8px}
  .row .r-stock{grid-column:1}
  .row .r-cover{grid-column:2;text-align:right}
  .row .r-end{grid-column:2;grid-row:1}
}

/* Status */
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.s-ok{background:var(--ok-soft);color:var(--ok)}
.chip.s-warn{background:var(--warn-soft);color:var(--warn)}
.chip.s-bad{background:var(--bad-soft);color:var(--bad)}
.chip.s-idle{background:var(--idle-soft);color:var(--idle)}
.s-ok{--c:var(--ok)}.s-warn{--c:var(--warn)}.s-bad{--c:var(--bad)}.s-idle{--c:var(--idle)}
.tag{font-size:14.5px;font-weight:700}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.idle{color:var(--idle)}

/* Stock meter: a blister strip of pips */
.pips{display:inline-grid;grid-template-columns:repeat(var(--cols,15),10px);gap:3px}
.pips i{width:10px;height:15px;border-radius:5px;border:1.5px solid var(--line);background:transparent}
.pips i.on{background:var(--c);border-color:var(--c)}
.pips i.half{background:linear-gradient(to top,var(--c) 50%,transparent 50%);border-color:var(--c)}
.pips.lg{grid-template-columns:repeat(var(--cols,15),16px);gap:5px}
.pips.lg i{width:16px;height:24px;border-radius:8px;border-width:2px}
.bar{display:block;height:10px;border-radius:99px;background:var(--idle-soft);overflow:hidden;width:100%;max-width:200px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar.lg{height:14px;max-width:320px}

/* Avatars */
.av{--c:#2450B8;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:16px}
.av.lg{width:58px;height:58px;font-size:23px}
.av.sm{width:30px;height:30px;font-size:13px}

/* Member cards */
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.mcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mc-top{display:flex;align-items:center;gap:14px}
.mcard .counts{display:flex;flex-wrap:wrap;gap:6px}

/* Today schedule */
.sched{list-style:none;margin:0;padding:0}
.sched-item{display:grid;grid-template-columns:82px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sched-item:first-child{border-top:0}
.s-time{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-what{display:flex;flex-direction:column;min-width:0}
.s-status{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.sched-item.past .s-time{color:var(--muted)}
@media (max-width:560px){.sched-item{grid-template-columns:72px minmax(0,1fr);row-gap:8px}.sched-item .av{display:none}.sched-item .s-status{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn-danger{color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:14.5px;border-radius:10px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row.center{justify-content:center}
.btn-col{display:flex;flex-direction:column;gap:10px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field>label,.lbl{font-weight:700;font-size:15.5px}
legend.lbl{padding:0;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;color:var(--ink)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
textarea{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.inline{display:flex;align-items:center;gap:10px}
.inline input{max-width:110px}
.err{color:var(--bad);font-weight:700;font-size:15px;margin-top:12px}
.slot-grid{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:center}
.slot-grid .hint{font-weight:700}
@media (max-width:600px){.slot-grid{grid-template-columns:86px minmax(0,1fr) minmax(0,1.2fr)}.slot-grid input[type=time]{padding:9px 6px}}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day input{position:absolute;opacity:0;pointer-events:none}
.day span{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;cursor:pointer}
.day input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches legend{width:100%}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:3px solid var(--accent);outline-offset:3px}
.preview,.total{padding:14px 16px;border-radius:var(--r-m);background:var(--accent-soft);font-size:15.5px}
.total:empty,.preview:empty{display:none}
.variance{padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);font-weight:700}
.variance.pos{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.variance.neg{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.variance.zero{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.big-num{font-size:34px;font-weight:700;line-height:1.1}

/* Dialog */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 70px rgba(8,18,28,.28)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(12,22,32,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px 0 22px}
.dlg-body{padding:16px 22px 20px;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.dlg-foot .spacer{flex:1}
@media (max-width:600px){
  dialog,dialog.wide{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:94vh}
  dialog form{max-height:94vh}
  .dlg-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.step-label{margin-bottom:16px}

/* Tables and stats */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15.5px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:14px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nowrap{white-space:nowrap}
.pos-q{color:var(--ok)}.neg-q{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);margin:0}
.stats>div{background:var(--surface);padding:16px 18px}
.stats dt{color:var(--muted);font-size:14.5px}
.stats dd{margin:4px 0 0;font-size:23px;font-weight:700;line-height:1.25}
.stats dd small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.4}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stock-hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.note{font-size:15px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* Alerts list */
.alert-item{display:grid;grid-template-columns:12px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.alert-item:first-of-type{border-top:0}
.alert-item .dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:6px}
.alert-item.unread h3::after{content:"New";margin-left:10px;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;vertical-align:2px}
.alert-item .btn-row{margin-top:10px}

/* Empty, gate, toast */
.empty{padding:40px 20px;text-align:center}
.empty h3{margin-bottom:6px;font-size:20px}
.empty p{color:var(--muted);margin-bottom:18px;max-width:46ch;margin-left:auto;margin-right:auto}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .panel{width:min(460px,100%);padding:32px 30px;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:30px}

<body>
<div id="root"></div>
<dialog id="modal"></dialog>
<input type="file" id="restore-file" accept="application/json,.json" hidden>
<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const KEY = 'family-med-tracker-v1';
const DAY = 864e5;
const SLOT_ORDER = ['morning','afternoon','evening','night','c1'];
const SLOT_LABEL = {morning:'Morning',afternoon:'Afternoon',evening:'Evening',night:'Night',c1:'Other time'};
const TYPES = ['Tablet','Capsule','Syrup','Injection','Other'];
const UNIT_BY_TYPE = {Tablet:'tablet',Capsule:'capsule',Syrup:'ml',Injection:'unit',Other:'unit'};
const PACK_LABEL = {Tablet:'Tablets per strip',Capsule:'Capsules per strip',Syrup:'ml per bottle',Injection:'Units per pen or vial',Other:'Units per pack'};
const PACK_WORD = {Tablet:'Strips',Capsule:'Strips',Syrup:'Bottles',Injection:'Pens or vials',Other:'Packs'};
const COLORS = ['#2450B8','#1D7A52','#9B3F92','#B85A16','#1F7F8E','#6650C8','#8C6A0E','#B8324F'];
const RELATIONS = ['Self','Mom','Dad','Brother','Sister','Spouse','Son','Daughter','Grandparent','Other'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TXN_LABEL = {opening:'Opening stock',purchase:'Purchase',taken:'Dose recorded',skip:'Dose skipped, stock restored',unskip:'Skip undone',count:'Count adjustment',adjust:'Stock adjustment',writeoff:'Written off'};
const DOSE_LABEL = {auto:'Dose deducted',short:'Dose due, not enough stock',taken:'Dose taken',skipped:'Dose skipped',pending:'Dose not confirmed'};
const CAT_LABEL = {member:'Family',medicine:'Medicine',stock:'Stock',dose:'Dose',alert:'Alert'};
const PLURAL = new Set(['tablet','capsule','unit','puff','drop','sachet','pen','vial','strip','dose','application']);

/* ---------- Utilities ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const diffDays = (a,b) => Math.round((parseD(b) - parseD(a)) / DAY);
const atTs = (date,time) => { const d = parseD(date); const [h,m] = (time||'00:00').split(':').map(Number); d.setHours(h,m,0,0); return d.getTime(); };
const round = x => Math.round(x*1000)/1000;
const today = () => dstr(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtShort = s => s ? parseD(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '—';
const fmtDay = s => parseD(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const fmtLong = s => parseD(s).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const fmtTs = t => new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const fmtTime = hm => { const [h,m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); };
const num = q => { const r = Math.round(q*100)/100; return String(r); };
function fmtQty(q, unit){ unit = unit || 'unit'; const n = num(q); return n + ' ' + (PLURAL.has(unit) && Math.abs(q) !== 1 ? unit + 's' : unit); }
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
const initial = name => (name||'?').trim().charAt(0).toUpperCase();
const val = (f,n) => (f.elements[n] && f.elements[n].value != null ? String(f.elements[n].value).trim() : '');
const numVal = (f,n) => { const v = parseFloat(val(f,n)); return isNaN(v) ? null : v; };

/* ---------- State ---------- */
function freshState(){
  return {version:1, profile:null,
    settings:{slotTimes:{morning:'08:00',afternoon:'14:00',evening:'18:00',night:'21:00',c1:'11:00'},lowDays:2,amberDays:7,expiryDays:30,theme:'light',browserNotify:false,skipCountsMissed:true},
    members:[], medicines:[], schedules:[], doses:{}, txns:[], counts:[], alerts:[], cycles:{}, log:[]};
}
let S = freshState();
let storageOk = true;
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ storageOk = false; }
  let obj = null;
  if (raw) { try { obj = JSON.parse(raw); } catch(e){ obj = null; } }
  S = normalise(obj);
}
function normalise(obj){
  const f = freshState();
  const s = Object.assign(f, obj || {});
  s.settings = Object.assign(freshState().settings, s.settings || {});
  s.settings.slotTimes = Object.assign(freshState().settings.slotTimes, s.settings.slotTimes || {});
  ['members','medicines','schedules','txns','counts','alerts','log'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.doses || typeof s.doses !== 'object') s.doses = {};
  if (!s.cycles || typeof s.cycles !== 'object') s.cycles = {};
  return s;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch(e){ storageOk = false; }
}

/* ---------- Lookups ---------- */
const memberById = id => S.members.find(m => m.id === id);
const medById = id => S.medicines.find(m => m.id === id);
const versionsOf = id => S.schedules.filter(v => v.m === id).sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : a.n - b.n);
const lowDaysOf = med => (med.lowDays ?? S.settings.lowDays);
function categories(){ return [...new Set(S.medicines.map(m => m.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function isArchivedMed(m){ const mem = memberById(m.memberId); return !mem || mem.archived; }

/* ---------- Schedule engine ---------- */
function versionOn(vers, date){
  for (let i = vers.length-1; i >= 0; i--){
    const v = vers[i];
    if (v.from <= date && (!v.to || date <= v.to)) return v;
  }
  return null;
}
function currentVersion(med, vers){
  vers = vers || versionsOf(med.id);
  const t = today();
  return versionOn(vers, t) || vers.filter(v => !v.to || v.to >= v.from).find(v => v.from > t) || vers[vers.length-1] || null;
}
function occursOn(rec, date, anchor){
  if (!rec || rec.type === 'daily') return true;
  if (rec.type === 'weekdays') return (rec.days||[]).includes(parseD(date).getDay());
  if (rec.type === 'everyN'){ const k = diffDays(rec.anchor || anchor, date); return k >= 0 && k % (rec.n||1) === 0; }
  return true;
}
function activeOn(med, date){
  if (date < med.startDate) return false;
  if (med.endDate && date > med.endDate) return false;
  if (med.status === 'discontinued' && med.discontinuedOn && date >= med.discontinuedOn) return false;
  for (const p of (med.pauses||[])){ if (date >= p.from && (!p.to || date <= p.to)) return false; }
  return true;
}
function occsOnDate(med, vers, date){
  if (med.prn || !activeOn(med, date)) return [];
  const v = versionOn(vers, date);
  if (!v || !occursOn(v.rec, date, v.from)) return [];
  return v.slots.filter(s => s.qty > 0)
    .map(s => ({date, slot:s.slot, time:s.time, qty:s.qty, v:v.id, ts:atTs(date, s.time)}))
    .sort((a,b) => a.ts - b.ts);
}
const slotName = s => { const k = s.slot || s.s; if (k && k !== 'c1' && SLOT_LABEL[k]) return SLOT_LABEL[k]; const tm = s.time || s.tm; return tm ? fmtTime(tm) : 'Other time'; };

/* ---------- Ledger ---------- */
function stockMap(){
  const m = {};
  for (const t of S.txns) m[t.m] = (m[t.m]||0) + t.q;
  for (const k in S.doses){ const d = S.doses[k]; if (d.ded) m[d.m] = (m[d.m]||0) - d.ded; }
  for (const k in m) m[k] = round(m[k]);
  return m;
}
function stockOf(id){ return stockMap()[id] || 0; }
function addTxn(med, type, q, note, extra){
  const t = Object.assign({id:uid(), m:med.id, type, q:round(q), at:Date.now(), note:note||''}, extra||{});
  S.txns.push(t); return t;
}
function logE(cat, med, text, extra){
  S.log.push(Object.assign({id:uid(), at:Date.now(), cat, m:med ? med.id : null, mem:med ? med.memberId : null, text}, extra||{}));
}

/* Process doses that have fallen due. Each medicine + date + slot gets exactly one dose record. */
function processDue(now){
  now = now || Date.now();
  const stock = stockMap();
  let changed = false;
  for (const med of S.medicines){
    if (med.prn){ med.doneUntil = now; continue; }
    const vers = versionsOf(med.id);
    const from = med.doneUntil || med.trackFrom;
    if (from >= now) continue;
    let d = dstr(new Date(from));
    const end = dstr(new Date(now));
    let guard = 0;
    while (d <= end && guard++ < 1200){
      for (const o of occsOnDate(med, vers, d)){
        if (o.ts < med.trackFrom || o.ts > now) continue;
        if (med.doneUntil && o.ts <= med.doneUntil) continue;
        const key = med.id + '|' + o.date + '|' + o.slot;
        if (S.doses[key]) continue;
        let ded = 0, st;
        if (med.autoDeduct){
          const have = Math.max(0, stock[med.id]||0);
          ded = round(Math.min(o.qty, have));
          st = ded + 1e-9 < o.qty ? 'short' : 'auto';
          stock[med.id] = round((stock[med.id]||0) - ded);
        } else st = 'pending';
        S.doses[key] = {m:med.id, d:o.date, s:o.slot, tm:o.time, t:o.ts, q:o.qty, ded, st, v:o.v};
        changed = true;
      }
      d = addDays(d, 1);
    }
    med.doneUntil = now;
  }
  return changed;
}

/* Forecast by stepping through the real future schedule. */
function forecast(med, vers, stockQty, pendingQty, now){
  now = now || Date.now();
  const res = {stock:stockQty, projected:round(stockQty - (pendingQty||0)), pending:pendingQty||0, runout:null, last:null, cover:Infinity, avgDaily:0, hasFuture:false};
  if (med.prn || med.status === 'discontinued') return res;
  let s = res.projected;
  const t0 = dstr(new Date(now));
  const d28 = addDays(t0, 28);
  let total28 = 0, d = t0;
  for (let i = 0; i <= 400; i++){
    if (med.endDate && d > med.endDate) break;
    for (const o of occsOnDate(med, vers, d)){
      if (d < d28) total28 += o.qty;
      if (o.ts <= now) continue;
      res.hasFuture = true;
      if (!res.runout){
        if (s + 1e-9 >= o.qty){ s = round(s - o.qty); res.last = o; }
        else res.runout = o;
      }
    }
    if (res.runout && d >= d28) break;
    d = addDays(d, 1);
  }
  res.avgDaily = round(total28 / 28);
  if (res.runout) res.cover = Math.max(0, diffDays(t0, res.runout.date) - 1);
  return res;
}
function statusOf(med, f){
  if (med.status === 'discontinued') return {key:'idle', label:'Discontinued', rank:5};
  if (med.status === 'paused') return {key:'idle', label:'Paused', rank:4};
  if (med.prn) return f.stock > 0 ? {key:'ok', label:'When needed', rank:3} : {key:'bad', label:'Out of stock', rank:0};
  if (!f.hasFuture) return {key:'idle', label:'No upcoming doses', rank:4};
  if (f.stock <= 0) return {key:'bad', label:'Out of stock', rank:0};
  if (f.cover <= lowDaysOf(med)) return {key:'bad', label:'Refill now', rank:1};
  if (f.cover <= S.settings.amberDays) return {key:'warn', label:'Running low', rank:2};
  return {key:'ok', label:'In stock', rank:3};
}
/* Remaining stock sits in the latest-expiring batches (earliest used first). */
function nearestExpiry(medId, stockQty){
  const b = S.txns.filter(t => t.m === medId && (t.type === 'purchase' || t.type === 'opening') && t.exp && t.q > 0)
    .sort((a,b) => b.exp.localeCompare(a.exp));
  let left = stockQty, nearest = null;
  for (const x of b){ if (left <= 1e-9) break; left -= x.q; nearest = x.exp; }
  return nearest;
}
function pendingMap(){
  const p = {};
  for (const k in S.doses){ const d = S.doses[k]; if (d.st === 'pending') p[d.m] = (p[d.m]||0) + d.q; }
  return p;
}
let C = null;
function snap(now){
  const stock = stockMap(), pend = pendingMap();
  const fc = {}, st = {}, exp = {};
  for (const m of S.medicines){
    const f = forecast(m, versionsOf(m.id), stock[m.id]||0, pend[m.id]||0, now);
    fc[m.id] = f; st[m.id] = statusOf(m, f); exp[m.id] = nearestExpiry(m.id, f.stock);
  }
  return {stock, pend, fc, st, exp};
}
function adherence(med, days){
  days = days || 30;
  const now = Date.now(), from = now - days*DAY;
  let expd = 0, miss = 0;
  for (const k in S.doses){
    const d = S.doses[k];
    if (d.m !== med.id || d.t < from || d.t > now) continue;
    expd += d.q;
    if (d.st === 'skipped' && S.settings.skipCountsMissed) miss += d.q;
  }
  for (const c of S.counts){ if (c.m === med.id && c.at >= from && c.variance > 0) miss += c.variance; }
  if (expd <= 0) return null;
  return Math.max(0, Math.min(1, 1 - miss/expd));
}
function avgDoseQty(med){
  const v = currentVersion(med);
  if (!v || !v.slots.length) return 1;
  const qs = v.slots.filter(s => s.qty > 0).map(s => s.qty);
  return qs.length ? qs.reduce((a,b)=>a+b,0)/qs.length : 1;
}

/* ---------- Alerts ---------- */
function housekeeping(){
  const t = today();
  for (const m of S.medicines){
    if (m.status === 'paused'){
      const p = (m.pauses||[])[m.pauses.length-1];
      if (p && p.to && t > p.to){ m.status = 'active'; logE('medicine', m, `Resumed ${m.name} automatically`); }
    }
  }
}
function coverText(f){
  if (f.cover === Infinity) return f.hasFuture ? 'Over a year' : '—';
  return plural(f.cover, 'day');
}
function addAlert(med, type, cyc, f, now, extra){
  const mem = memberById(med.memberId) || {name:'Someone'};
  let title = '', body = '';
  if (type === 'low'){
    title = `${med.name} for ${mem.name} needs a refill`;
    body = `${fmtQty(f.stock, med.unit)} left, ${coverText(f)} of cover. ` +
      (f.last ? `Last covered dose is ${fmtDay(f.last.date)}, ${slotName(f.last).toLowerCase()}. ` : '') +
      `Runs out ${fmtDate(f.runout.date)}. Count what’s left to check doses were taken.`;
  } else if (type === 'zero'){
    title = `${med.name} for ${mem.name} is out of stock`;
    body = `Expected stock has reached zero, based on the schedule. ` + (f.runout ? `Next dose is due ${fmtDay(f.runout.date)}. ` : '') + `Count to confirm, then record a purchase.`;
  } else if (type === 'expiry'){
    const dd = diffDays(today(), extra.exp);
    title = dd < 0 ? `${med.name} for ${mem.name} has expired` : `${med.name} for ${mem.name} expires soon`;
    body = dd < 0 ? `Stock expired on ${fmtDate(extra.exp)}. Remove it with Adjust stock and buy fresh.` : `The oldest stock expires on ${fmtDate(extra.exp)}, in ${plural(dd,'day')}.`;
  }
  const a = Object.assign({id:uid(), m:med.id, mem:med.memberId, type, cyc, at:now, read:false, res:null, title, body}, extra||{});
  S.alerts.push(a);
  logE('alert', med, title);
  return a;
}
function resolveAlerts(pred, now){ for (const a of S.alerts){ if (!a.res && pred(a)) a.res = now; } }
function evaluateAlerts(now){
  now = now || Date.now();
  const sn = snap(now);
  const created = [];
  const t = dstr(new Date(now));
  for (const med of S.medicines){
    const f = sn.fc[med.id];
    const watching = med.status === 'active' && !med.prn;
    let cyc = S.cycles[med.id];
    const zero = watching && f.hasFuture && f.stock <= 0;
    const low = watching && f.hasFuture && f.cover <= lowDaysOf(med);
    if (low || zero){
      if (!cyc){ cyc = S.cycles[med.id] = {id:uid(), at:now, low:false, zero:false}; }
      if (zero && !cyc.zero){ cyc.zero = true; cyc.low = true; created.push(addAlert(med, 'zero', cyc.id, f, now)); }
      else if (low && !cyc.low){ cyc.low = true; created.push(addAlert(med, 'low', cyc.id, f, now)); }
    } else if (cyc){
      resolveAlerts(a => a.cyc === cyc.id, now);
      S.cycles[med.id] = null;
    }
    const exp = med.status !== 'discontinued' && f.stock > 0 ? sn.exp[med.id] : null;
    const expKey = exp ? med.id + '|' + exp : null;
    resolveAlerts(a => a.m === med.id && a.type === 'expiry' && a.key !== expKey, now);
    if (exp && diffDays(t, exp) <= S.settings.expiryDays && !S.alerts.some(a => a.key === expKey)){
      created.push(addAlert(med, 'expiry', null, f, now, {exp, key:expKey}));
    }
  }
  return created;
}

/* ---------- UI helpers ---------- */
const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  today: SV('<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>'),
  family: SV('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.2" cy="9" r="2.5"/><path d="M16.5 14.6c2.5.2 4.3 1.9 5 4.9"/>'),
  pill: SV('<rect x="2.6" y="8.2" width="18.8" height="7.6" rx="3.8" transform="rotate(-38 12 12)"/><path d="M9.6 7.4l4.8 9.2"/>'),
  bell: SV('<path d="M6 9.5a6 6 0 1 1 12 0c0 5.6 2.4 7 2.4 7H3.6S6 15.1 6 9.5z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/>'),
  history: SV('<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/>'),

function meter(med, f, st, lg){
  const ref = Math.max(f.stock, med.unitsPerPack || 0, 1);
  const countable = ['tablet','capsule'].includes(med.unit) && ref <= 30;
  const label = `${fmtQty(f.stock, med.unit)} left`;
  if (countable){
    const n = Math.ceil(ref), full = Math.floor(f.stock + 1e-9), half = (f.stock - full) >= 0.25;
    let h = '';
    for (let i = 0; i < n; i++) h += `<i class="${i < full ? 'on' : (i === full && half ? 'half' : '')}"></i>`;
    const cols = Math.min(n, 15);
    return `<span class="pips ${lg?'lg':''} s-${st.key}" style="--cols:${cols}" role="img" aria-label="${esc(label)}">${h}</span>`;
  }
  const pct = Math.max(0, Math.min(100, f.stock / ref * 100));

}

function todayItems(meds){

function medMatchesStatus(m, s){

async function hashPw(pw, salt){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:150000, hash:'SHA-256'}, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function openModal(o){
  dlg.className = o.wide ? 'wide' : '';
  dlg.innerHTML = `<form id="dlg-form" novalidate><div class="dlg-head"><h2 id="dlg-title">${esc(o.title)}</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">${I.close}</button></div>
    <div class="dlg-body">${o.body}<p class="err" id="dlg-err" role="alert" hidden></p></div>
    <div class="dlg-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button>${o.hideSubmit ? '' : `<button type="submit" class="btn ${o.danger ? 'btn-danger-solid' : 'btn-primary'}" id="dlg-submit">${esc(o.submit || 'Save')}</button>`}</div></form>`;
  dlg.setAttribute('aria-labelledby','dlg-title');
  dlgHandler = o.onSubmit;
  if (!dlg.open){ dlg.showModal(); try { history.pushState({fmtModal:1}, ''); } catch(e){} }
  const f = dlg.querySelector('form');
  if (o.onMount) o.onMount(f);
  const first = dlg.querySelector('.dlg-body input:not([type=hidden]):not([type=radio]):not([type=checkbox]), .dlg-body select, .dlg-body textarea');
  if (first) first.focus();
}
let ignorePop = false, navAfter = null;
function closeModal(fromPop){
  if (!dlg.open) return;
  dlg.close(); dlgHandler = null; dlg.innerHTML = '';
  if (!fromPop && history.state && history.state.fmtModal){ ignorePop = true; history.back(); }
}
function go(h){ if (ignorePop) navAfter = h; else location.hash = h; }
window.addEventListener('popstate', () => {
  if (ignorePop){ ignorePop = false; if (navAfter){ const h = navAfter; navAfter = null; location.hash = h; } return; }
  if (dlg.open) closeModal(true);
});
dlg.addEventListener('cancel', e => { e.preventDefault(); closeModal(); });
function showErr(f, msg){ const el = f.querySelector('#dlg-err'); el.textContent = msg; el.hidden = false; }
dlg.addEventListener('submit', async e => {
  e.preventDefault();
  if (!dlgHandler) return;
  const f = e.target;
  f.querySelector('#dlg-err').hidden = true;
  const r = await dlgHandler(f);
  if (typeof r === 'string') showErr(f, r);
  else if (r !== false) closeModal();
});
dlg.addEventListener('click', e => { if (e.target === dlg) closeModal(); });
function confirmBox(title, text, okLabel, danger){
  return new Promise(res => {
    openModal({title, body:`<p>${text}</p>`, submit:okLabel, danger, onSubmit:() => { res(true); }});
    dlg.addEventListener('close', () => res(false), {once:true});
  });
}

/* ---------- Schedule form parts ---------- */
function scheduleFields(pref){
  const rec = (pref && pref.rec) || {type:'daily', days:[1,2,3,4,5,6,0], n:2};
  const sl = {}; ((pref && pref.slots) || []).forEach(s => sl[s.slot] = s);
  const rows = SLOT_ORDER.map(k => {
    const s = sl[k], q = s ? s.qty : 0, t = s ? s.time : S.settings.slotTimes[k];
    return `<span class="lbl">${SLOT_LABEL[k]}</span>
      <input type="number" name="q_${k}" min="0" step="0.25" value="${q}" inputmode="decimal" aria-label="${SLOT_LABEL[k]} quantity">
      <input type="time" name="t_${k}" value="${esc(t)}" aria-label="${SLOT_LABEL[k]} time">`;
  }).join('');
  const days = (rec.days && rec.days.length) ? rec.days : [1,2,3,4,5,6,0];
  return `<div class="field full"><span class="lbl">How much at each time</span><p class="hint">Leave 0 for times it isn’t taken. Use 0.5 for half a tablet.</p>
      <div class="slot-grid" style="margin-top:6px"><span></span><span class="hint">Quantity</span><span class="hint">Time</span>${rows}</div></div>
    <div class="field"><label for="f-rtype">Repeat</label><select id="f-rtype" name="rtype">
      <option value="daily"${rec.type==='daily'?' selected':''}>Every day</option>
      <option value="weekdays"${rec.type==='weekdays'?' selected':''}>On certain days of the week</option>
      <option value="everyN"${rec.type==='everyN'?' selected':''}>Every few days</option></select></div>
    <div class="field" data-show="everyN"><label for="f-rn">Every how many days</label><input type="number" id="f-rn" name="rn" min="2" step="1" value="${rec.n || 2}"></div>
    <fieldset class="field full" data-show="weekdays"><legend class="lbl">Days</legend><div class="days">${[1,2,3,4,5,6,0].map(d => `<label class="day"><input type="checkbox" name="wd" value="${d}"${days.includes(d)?' checked':''}><span>${DOW[d]}</span></label>`).join('')}</div></fieldset>`;
}
function wireRepeat(f){
  const sel = f.elements.rtype;
  const upd = () => f.querySelectorAll('[data-show]').forEach(el => { el.hidden = el.dataset.show !== sel.value; });
  sel.addEventListener('change', upd); upd();
}
function readSchedule(f){
  const slots = [];
  for (const k of SLOT_ORDER){
    const q = parseFloat(f.elements['q_' + k].value) || 0;
    if (q < 0) return 'Quantities can’t be negative.';
    const t = f.elements['t_' + k].value || S.settings.slotTimes[k];
    if (q > 0) slots.push({slot:k, qty:round(q), time:t});
  }
  if (!slots.length) return 'Enter a quantity for at least one time of day.';
  const type = f.elements.rtype.value, rec = {type};
  if (type === 'weekdays'){ rec.days = [...f.querySelectorAll('input[name=wd]:checked')].map(x => +x.value); if (!rec.days.length) return 'Pick at least one day of the week.'; }
  if (type === 'everyN'){ rec.n = parseInt(f.elements.rn.value, 10); if (!(rec.n >= 2)) return 'Enter 2 days or more.'; }
  return {rec, slots};
}
function withNewVersion(vers, medId, from, rec, slots){
  const out = vers.map(v => Object.assign({}, v));
  for (const v of out){
    if (v.to && v.to < v.from) continue;
    if (v.from >= from) v.to = addDays(v.from, -1);
    else if (!v.to || v.to >= from) v.to = addDays(from, -1);
  }
  const n = out.reduce((a,v) => Math.max(a, v.n), 0) + 1;
  const nv = {id:uid(), m:medId, n, from, to:null, rec, slots, at:Date.now()};
  out.push(nv);
  return {out, nv};
}
function previewText(med, vers, stockQty){
  const f = forecast(med, vers, stockQty, 0);
  if (!f.hasFuture) return 'No doses fall on or after today with this schedule.';
  const p = [`Average use is ${fmtQty(f.avgDaily, med.unit)} a day.`];
  if (!f.last) p.push('There isn’t enough stock for the next dose.');
  else if (f.runout){
    p.push(`${fmtQty(stockQty, med.unit)} lasts until ${fmtDay(f.last.date)} and runs out on ${fmtDate(f.runout.date)}, ${coverText(f)} of cover.`);
    if (f.cover <= lowDaysOf(med)) p.push('A refill alert will show straight away.');
  } else p.push('Stock covers more than a year at this rate.');
  return p.join(' ');
}

/* ---------- Medicines ---------- */
function createMedicine(d, opts){
  const now = Date.now();
  const back = opts && opts.backdate;
  const trackFrom = back ? atTs(d.startDate, '00:00') : Math.max(now, atTs(d.startDate, '00:00'));
  const med = {id:uid(), memberId:d.memberId, name:d.name, type:d.type, unit:d.unit, unitsPerPack:d.per || 0, category:d.category || '', notes:d.notes || '', prn:!!d.prn,
    startDate:d.startDate, endDate:d.endDate || null, lowDays:d.lowDays, autoDeduct:d.autoDeduct !== false, status:'active', pauses:[], createdAt:back ? trackFrom : now, trackFrom};
  S.medicines.push(med);
  const at = back ? trackFrom : now;
  if (d.qty > 0){
    const type = d.stockMode === 'opening' ? 'opening' : 'purchase';
    const note = type === 'purchase' && d.packs ? `${num(d.packs)} × ${num(d.per)}${d.loose ? ' + ' + num(d.loose) + ' loose' : ''}` : '';
    S.txns.push({id:uid(), m:med.id, type, q:round(d.qty), at, note, exp:d.exp || null, on:d.startDate});
    S.log.push({id:uid(), at, cat:'stock', m:med.id, mem:med.memberId, text:`${TXN_LABEL[type]}: ${fmtQty(d.qty, med.unit)}`});
  }
  if (!d.prn) S.schedules.push({id:uid(), m:med.id, n:1, from:d.startDate, to:null, rec:d.rec, slots:d.slots, at});
  S.log.push({id:uid(), at:at - 1, cat:'medicine', m:med.id, mem:med.memberId, text:`Added ${med.name}` + (d.prn ? ', taken when needed' : `: ${slotsText(d.slots, med.unit)}, ${recText(d.rec).toLowerCase()}`)});
  return med;
}
function modalMedNew(preset){

  const cats = categories();
  const body = `<div class="steps" aria-hidden="true"><span class="on"></span><span></span><span></span></div><p class="hint step-label" id="step-label">Step 1 of 3: the medicine</p>
    <div data-step="1" class="form-grid">

      <label class="check full"><input type="checkbox" name="prn"><span><b>Taken only when needed</b><br><span class="hint">Stock is tracked, but there’s no schedule and no run-out forecast.</span></span></label>
      <div class="field full"><label for="m-notes">Notes or instructions (optional)</label><textarea id="m-notes" name="notes" maxlength="500" placeholder="For example, take after food"></textarea></div>
    </div>
    <div data-step="2" class="form-grid" hidden>
      <fieldset class="field full"><legend class="lbl">Stock</legend>
        <label class="check"><input type="radio" name="smode" value="purchase" checked><span>I’m adding packs I’ve just bought</span></label>
        <label class="check"><input type="radio" name="smode" value="opening"><span>It’s already in use. I’ll enter what’s left</span></label></fieldset>
      <div class="field"><label for="m-per" id="m-per-label">Tablets per strip</label><input type="number" id="m-per" name="per" min="0" step="any" inputmode="decimal" value="15"></div>
      <div class="field" data-mode="purchase"><label for="m-packs" id="m-packs-label">Strips bought</label><input type="number" id="m-packs" name="packs" min="0" step="1" value="1"></div>
      <div class="field" data-mode="purchase"><label for="m-loose">Extra loose quantity</label><input type="number" id="m-loose" name="loose" min="0" step="any" value="0"></div>
      <div class="field" data-mode="opening"><label for="m-open">Quantity left right now</label><input type="number" id="m-open" name="openQty" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label for="m-exp">Expiry date (optional)</label><input type="date" id="m-exp" name="exp"></div>
      <p class="full total" id="m-total"></p>
    </div>
    <div data-step="3" class="form-grid" hidden>
      <div class="field"><label for="m-start">Start date</label><input type="date" id="m-start" name="startDate" value="${today()}"></div>
      <div class="field" data-sched><label for="m-end">End date (optional)</label><input type="date" id="m-end" name="endDate"></div>
      <div class="full form-grid" data-sched style="gap:16px">${scheduleFields(null)}</div>
      <div class="field" data-sched><label for="m-low">Refill alert when stock covers</label><div class="inline"><input type="number" id="m-low" name="lowDays" min="0" max="60" step="1" value="${S.settings.lowDays}"><span>days or less</span></div></div>
      <label class="check full" data-sched><input type="checkbox" name="autoDeduct" checked><span><b>Deduct doses automatically</b><br><span class="hint">Stock goes down at each scheduled time. You can mark a dose as skipped afterwards.</span></span></label>
      <p class="full hint" data-prnnote hidden>No schedule is needed. Use Record a dose on the medicine page whenever it’s taken.</p>
      <div class="preview full" id="m-preview" aria-live="polite"></div>
    </div>`;
  let step = 1, unitTouched = false;
  openModal({title:'Add medicine', submit:'Next', wide:true, body,
    onMount:f => {
      const foot = f.querySelector('.dlg-foot'), submit = f.querySelector('#dlg-submit');
      const back = document.createElement('button'); back.type = 'button'; back.className = 'btn'; back.textContent = 'Back'; back.hidden = true;
      foot.insertBefore(back, submit);
      const labels = ['the medicine','stock','schedule'];
      const qty = () => f.elements.smode.value === 'opening' ? (numVal(f,'openQty') || 0) : (numVal(f,'packs') || 0) * (numVal(f,'per') || 0) + (numVal(f,'loose') || 0);
      const updType = () => {
        const t = f.elements.type.value;
        if (!unitTouched) f.elements.unit.value = UNIT_BY_TYPE[t];
        f.querySelector('#m-per-label').textContent = PACK_LABEL[t];
        f.querySelector('#m-packs-label').textContent = PACK_WORD[t] + ' bought';
      };
      const updMode = () => { const md = f.elements.smode.value; f.querySelectorAll('[data-mode]').forEach(el => { el.hidden = el.dataset.mode !== md; }); };
      const updTotal = () => { f.querySelector('#m-total').textContent = `Total stock: ${fmtQty(qty(), val(f,'unit') || 'unit')}`; };
      const updPrn = () => { const prn = f.elements.prn.checked; f.querySelectorAll('[data-sched]').forEach(el => { el.hidden = prn; }); f.querySelector('[data-prnnote]').hidden = !prn; };
      const updPreview = () => {
        const out = f.querySelector('#m-preview');
        if (f.elements.prn.checked){ out.textContent = ''; return; }
        const sch = readSchedule(f);
        if (typeof sch === 'string'){ out.textContent = ''; return; }
        const start = val(f,'startDate') || today();
        const tmp = {id:'tmp', prn:false, status:'active', pauses:[], startDate:start, endDate:val(f,'endDate') || null, unit:val(f,'unit') || 'unit', lowDays:numVal(f,'lowDays') ?? S.settings.lowDays};
        out.textContent = previewText(tmp, [{id:'v', from:start, to:null, rec:sch.rec, slots:sch.slots}], qty());
      };
      const show = () => {
        f.querySelectorAll('[data-step]').forEach(el => { el.hidden = +el.dataset.step !== step; });
        f.querySelectorAll('.steps span').forEach((el,i) => el.classList.toggle('on', i < step));
        f.querySelector('#step-label').textContent = `Step ${step} of 3: ${labels[step-1]}`;
        back.hidden = step === 1; submit.textContent = step === 3 ? 'Add medicine' : 'Next';
        if (step === 2) updTotal();
        if (step === 3){ updPrn(); updPreview(); }
        const first = f.querySelector(`[data-step="${step}"] input:not([type=radio]):not([type=checkbox]):not([hidden]), [data-step="${step}"] select`);
        first && first.focus();
      };
      back.addEventListener('click', () => { step--; f.querySelector('#dlg-err').hidden = true; show(); });
      f.elements.type.addEventListener('change', () => { updType(); });
      f.elements.unit.addEventListener('input', () => { unitTouched = true; });
      f.querySelectorAll('input[name=smode]').forEach(r => r.addEventListener('change', () => { updMode(); updTotal(); }));
      f.addEventListener('input', () => { if (step === 2) updTotal(); if (step === 3) updPreview(); });
      f.addEventListener('change', () => { if (step === 3) updPreview(); });
      wireRepeat(f); updType(); updMode();
      f._step = () => step; f._next = () => { step++; show(); }; f._qty = qty;
    },
    onSubmit:f => {
      const step = f._step();
      if (step === 1){
        if (!val(f,'name')) return 'Enter the medicine name.';
        if (!val(f,'unit')) return 'Enter the unit you count it in, such as tablet or ml.';
        f._next(); return false;
      }
      if (step === 2){
        const per = numVal(f,'per'); const q = f._qty();
        if (per != null && per < 0) return 'Pack size can’t be negative.';
        if (f.elements.smode.value === 'purchase' && !(q > 0)) return 'Enter how much you bought.';
        if (f.elements.smode.value === 'opening' && numVal(f,'openQty') == null) return 'Enter how much is left right now, even if it’s 0.';
        if (q < 0) return 'Stock can’t be negative.';
        f._next(); return false;
      }
      const prn = f.elements.prn.checked;
      const startDate = val(f,'startDate');
      if (!startDate) return 'Enter a start date.';
      const endDate = prn ? '' : val(f,'endDate');
      if (endDate && endDate < startDate) return 'The end date is before the start date.';
      let sch = {rec:null, slots:[]};
      if (!prn){ sch = readSchedule(f); if (typeof sch === 'string') return sch; }
      const lowDays = numVal(f,'lowDays');
      const med = createMedicine({memberId:val(f,'memberId'), name:val(f,'name'), type:val(f,'type'), unit:val(f,'unit').toLowerCase(), per:numVal(f,'per') || 0, category:val(f,'category'), notes:val(f,'notes'), prn,
        startDate, endDate, lowDays:lowDays == null ? S.settings.lowDays : Math.max(0, Math.round(lowDays)), autoDeduct:prn ? true : f.elements.autoDeduct.checked,
        qty:f._qty(), stockMode:f.elements.smode.value, packs:numVal(f,'packs') || 0, loose:numVal(f,'loose') || 0, exp:val(f,'exp') || null, rec:sch.rec, slots:sch.slots});
      closeModal(); commit(); toast(`${med.name} added`);
      go('#medicine-' + med.id);
      return false;
    }});
}

function modalSchedule(id){
  const m = medById(id); if (!m) return;
  const vers = versionsOf(m.id), cur = currentVersion(m, vers);
  const minFrom = m.startDate > today() ? m.startDate : today();
  openModal({title:'Change dose or schedule', submit:'Save new schedule', wide:true,
    body:`<p class="muted" style="margin-bottom:16px">Current: ${esc(cur ? slotsText(cur.slots, m.unit) + ', ' + recText(cur.rec).toLowerCase() : 'none')}. Earlier doses and stock history stay exactly as they are.</p>

function modalCount(id){
  const m = medById(id); if (!m) return;
  const f0 = C.fc[m.id], expected = f0.stock, avg = avgDoseQty(m);
  openModal({title:`Count & reconcile: ${m.name}`, submit:'Save count',
    body:`<p class="muted small">Expected stock</p><p class="big-num" style="margin-bottom:16px">${esc(fmtQty(expected, m.unit))}</p>
      ${f0.pending > 0 ? `<p class="warnbar">${esc(fmtQty(f0.pending, m.unit))} in doses aren’t confirmed yet. Confirm them first for an accurate comparison.</p>` : ''}
      <div class="form-grid"><div class="field"><label for="c-qty">How many did you count?</label><input type="number" id="c-qty" name="counted" min="0" step="any" inputmode="decimal"></div><span></span>
      <div class="field full" data-neg hidden><label for="c-reason">What happened to the difference?</label><select id="c-reason" name="reason"><option value="">Choose a reason</option><option>Wastage or spillage</option><option>Extra doses taken</option><option>Lost</option><option>Given to someone else</option><option>Counting mistake earlier</option><option>Other</option></select></div>
      <p class="full variance" id="c-var" aria-live="polite" hidden></p></div>`,
    onMount:f => {
      const upd = () => {
        const c = numVal(f,'counted'), out = f.querySelector('#c-var'), neg = f.querySelector('[data-neg]');
        if (c == null){ out.hidden = true; neg.hidden = true; return; }
        const v = round(c - expected);
        out.hidden = false; neg.hidden = v >= 0;
        out.className = 'full variance ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero');
        if (v > 0) out.textContent = m.prn ? `${fmtQty(v, m.unit)} more than expected. Stock will be corrected to ${fmtQty(c, m.unit)}.` : `${fmtQty(v, m.unit)} more than expected. This records about ${num(round(v/avg))} missed ${round(v/avg) === 1 ? 'dose' : 'doses'} and corrects stock to ${fmtQty(c, m.unit)}.`;
        else if (v < 0) out.textContent = `${fmtQty(-v, m.unit)} fewer than expected. Stock will be corrected to ${fmtQty(c, m.unit)}.`;
        else out.textContent = 'Matches expected stock. Doses look on track.';
      };
      f.addEventListener('input', upd); f.addEventListener('change', upd);
    },
    onSubmit:f => {
      const c = numVal(f,'counted');
      if (c == null) return 'Enter the quantity you counted.';
      if (c < 0) return 'The count can’t be negative.';
      const v = round(c - expected);
      const reason = val(f,'reason');
      if (v < 0 && !reason) return 'Choose what happened to the difference.';
      const missed = v > 0 && !m.prn ? round(v / avg) : 0;
      if (v !== 0) addTxn(m, 'count', v, v > 0 ? (m.prn ? 'Found more than expected' : `About ${num(missed)} missed doses`) : reason);
      S.counts.push({id:uid(), m:m.id, at:Date.now(), expected, counted:round(c), variance:v, missed, reason:v < 0 ? reason : ''});
      logE('stock', m, v === 0 ? `Counted ${fmtQty(c, m.unit)}, matches expected` : v > 0 ? `Counted ${fmtQty(c, m.unit)}, expected ${num(expected)}: ${num(v)} more${m.prn ? '' : `, about ${num(missed)} missed doses`}` : `Counted ${fmtQty(c, m.unit)}, expected ${num(expected)}: ${num(-v)} fewer (${reason})`);
      commit(); toast('Count saved');
    }});
}

/* ---------- Doses ---------- */
function skipDose(key){
  const d = S.doses[key]; if (!d) return;
  const m = medById(d.m); if (!m) return;
  if (d.st === 'auto' || d.st === 'short' || d.st === 'taken'){
    if (d.ded > 0){ addTxn(m, 'skip', d.ded, `${fmtDay(d.d)}, ${slotName(d).toLowerCase()}`, {dose:key}); d.rest = d.ded; }
    d.prev = d.st; d.st = 'skipped';
  } else if (d.st === 'pending'){ d.prev = 'pending'; d.st = 'skipped'; d.rest = 0; }
  else return;
  logE('dose', m, `Marked ${fmtDay(d.d)}, ${slotName(d).toLowerCase()} as skipped`);
  commit(); toast('Dose marked as skipped');
}
function undoSkip(key){
  const d = S.doses[key]; if (!d || d.st !== 'skipped') return;
  const m = medById(d.m); if (!m) return;
  if (d.rest > 0){
    const have = Math.max(0, stockOf(m.id));
    const back = round(Math.min(d.rest, have));
    if (back > 0) addTxn(m, 'unskip', -back, `${fmtDay(d.d)}, ${slotName(d).toLowerCase()}`, {dose:key});
    d.rest = 0;
  }
  d.st = d.prev || 'auto';
  logE('dose', m, `Undid skip for ${fmtDay(d.d)}, ${slotName(d).toLowerCase()}`);
  commit(); toast('Skip undone');
}
function takeDose(key){
  const d = S.doses[key]; if (!d || d.st !== 'pending') return;
  const m = medById(d.m); if (!m) return;
  const have = Math.max(0, stockOf(m.id));
  d.ded = round(Math.min(d.q, have)); d.st = d.ded + 1e-9 < d.q ? 'short' : 'taken';
  logE('dose', m, `Confirmed ${fmtDay(d.d)}, ${slotName(d).toLowerCase()} as taken`);
  commit(); toast('Dose confirmed');
}

function download(name, text, type){
  const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportCsv(){
  const rows = filteredHistory();
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';

}

  'sample': () => { loadSample(); commit(); toast('Sample family loaded'); go('#today'); },
  'erase': () => confirmBox('Erase all data?', 'This deletes every family member, medicine and history entry from this browser. Download a backup first if you might need it.', 'Erase everything', true).then(ok => {
    if (!ok) return; try { localStorage.removeItem(KEY); } catch(e){} S = freshState(); unlocked = false; closeModal(); go('#today'); document.getElementById('root').innerHTML = ''; render();
  }),
  'forgot': () => confirmBox('Erase this device’s data?', 'Without the password the app can’t be opened. Erasing removes all data saved in this browser so you can start again. If you have a backup file, you can restore it afterwards.', 'Erase and start again', true).then(ok => {
    if (!ok) return; try { localStorage.removeItem(KEY); } catch(e){} S = freshState(); closeModal(); render();
  })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
function onFilter(e){
  const el = e.target.closest('[data-filter]'); if (!el) return;
  const k = el.dataset.filter; U[k] = el.value;
  if (k === 'hMem') U.hMed = '';
  if (k.startsWith('h')) U.hLimit = 150;
  render();
}
document.addEventListener('input', e => { if (e.target.matches('input[data-filter]')) onFilter(e); });
document.addEventListener('change', e => { if (e.target.matches('select[data-filter]')) onFilter(e); });
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'dlg-form') return;
  e.preventDefault();
  if (f.id === 'setup-form'){
    const err = f.querySelector('#setup-err'); err.hidden = true;
    const pw = f.elements.pw ? f.elements.pw.value : '';
    if (pw){
      if (pw.length < 4){ err.textContent = 'Use at least 4 characters for the password, or leave it empty.'; err.hidden = false; return; }
      if (pw !== f.elements.pw2.value){ err.textContent = 'The two passwords don’t match.'; err.hidden = false; return; }
    }
    let auth = null;
    if (pw){ const salt = uid() + uid(); auth = {salt, hash:await hashPw(pw, salt)}; }
    S.profile = {name:val(f,'name'), auth, createdAt:Date.now()};
    unlocked = true;
    if (e.submitter && e.submitter.value === 'sample') loadSample();
    document.getElementById('root').innerHTML = '';
    commit();
  } else if (f.id === 'lock-form'){
    const err = f.querySelector('#lock-err');
    const h = await hashPw(f.elements.pw.value, S.profile.auth.salt);
    if (h === S.profile.auth.hash){ unlocked = true; document.getElementById('root').innerHTML = ''; commit(); }
    else { err.textContent = 'That password isn’t right.'; err.hidden = false; f.elements.pw.select(); }
  } else if (f.id === 'settings-form'){
    const s = S.settings;
    const ints = {lowDays:[0,60], amberDays:[1,90], expiryDays:[0,365]};
    for (const k in ints){ const v = numVal(f, k); if (v == null || v < ints[k][0] || v > ints[k][1]){ toast('Check the numbers in Alerts'); return; } }
    S.profile.name = val(f,'name');
    for (const k of SLOT_ORDER){ const t = val(f, 't_' + k); if (t) s.slotTimes[k] = t; }
    s.lowDays = Math.round(numVal(f,'lowDays')); s.amberDays = Math.round(numVal(f,'amberDays')); s.expiryDays = Math.round(numVal(f,'expiryDays'));
    s.theme = val(f,'theme'); s.skipCountsMissed = f.elements.skipCountsMissed.checked;
    const wantNotify = f.elements.browserNotify.checked;
    if (wantNotify && 'Notification' in window && Notification.permission !== 'granted'){
      try { const p = await Notification.requestPermission(); s.browserNotify = p === 'granted'; if (p !== 'granted') toast('Notifications are blocked in this browser’s settings'); } catch(err){ s.browserNotify = false; }
    } else s.browserNotify = wantNotify;
    applyTheme(); commit(); toast('Settings saved');
  }
});
document.getElementById('restore-file').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj; try { obj = JSON.parse(r.result); } catch(err){ toast('That file isn’t a backup from this app'); return; }
    if (!obj || !Array.isArray(obj.members) || !Array.isArray(obj.medicines)){ toast('That file isn’t a backup from this app'); return; }
    confirmBox('Restore this backup?', `It has ${people(obj.members.length)} and ${plural(obj.medicines.length,'medicine')}. Everything currently in the app will be replaced.`, 'Restore backup', true).then(ok => {
      if (!ok) return;
      S = normalise(obj); unlocked = !(S.profile && S.profile.auth);
      closeModal(); applyTheme(); document.getElementById('root').innerHTML = ''; commit(); toast('Backup restored');
    });
  };
  r.readAsText(file);
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); const m = document.getElementById('main'); if (m) m.focus({preventScroll:true}); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (S.profile && S.profile.auth && unlocked && hiddenAt && Date.now() - hiddenAt > 15*60*1000){ unlocked = false; closeModal(); render(); return; }
  tick();
});
function tick(){
  if (!S.profile || (S.profile.auth && !unlocked)) return;
  housekeeping(); processDue(); const created = evaluateAlerts(); save(); created.forEach(notify);
  if (!dlg.open) render();
}

/* ---------- Start ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (S.profile && unlocked) render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('App installed'); if (S.profile && unlocked) render(); });
if ('serviceWorker' in navigator && canInstallHere()) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
load(); applyTheme();
unlocked = !(S.profile && S.profile.auth);
if (S.profile && unlocked){ housekeeping(); processDue(); evaluateAlerts(); save(); }
render();
setInterval(tick, 60000);
})();
</script>
</body>
</html>
